<!DOCTYPE html>
<html lang="en">
<head>
    <link href="style.css" rel="stylesheet">
    <link href="archive.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stand Archive</title>

</head>
<body>
    <h1 class="TitleCard">Stand Archive</h1>
    <p>Your collection of generated Stands</p>
    <div class="archive-card-container" id="archiveContainer"></div>
    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 30px;">
        <a href="index.html" class="back-button">← Back to Generator</a>
        <label for="filter_by" class="filter_by">Filter By:</label>
        <select name="filter_by" id="filter" class="filter_by">
            <option value="date_asc">Date Generated (Ascending)</option>
            <option value="date_des">Date Generated (Descending)</option>
            <option value="stats_asc">Stats (Ascending)</option>
            <option value="stats_des">Stats (Descending)</option>
        </select>
        <button onclick="clearArchive()" class="back-button clear-button">Clear Archive</button>
    </div>
</body>
<script src="archive.js"></script>
</html>
